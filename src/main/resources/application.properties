# Market Scanner - Production Configuration
# Version: 1-PRODUCTION

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server.port=8080
spring.application.name=market-scanner

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
spring.datasource.url=jdbc:sqlite:data/market_scanner.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/sqlite
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.sql.init.mode=never

spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON;
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=0


# ============================================================================
# EXCHANGE CONFIGURATION (INFORMATIONAL ONLY)
# ============================================================================
exchange.timezone=Asia/Kolkata
exchange.marketOpen=09:15
exchange.marketClose=15:30

# ============================================================================
# SCHEDULER CONFIGURATION
# ============================================================================
scanner.enabled=true
scanner.schedule.cron=0 0 19 * * *
scanner.schedule.zone=Asia/Kolkata

# ============================================================================
# PROVIDER PUBLISH BUFFER
# ============================================================================
provider.publishBufferHours=3

# ============================================================================
# PROVIDER RESILIENCE
# ============================================================================
provider.retry.maxAttempts=3
provider.retry.baseBackoffMs=1000
provider.retry.jitterMaxMs=500
provider.circuitBreaker.failureThreshold=5
provider.circuitBreaker.cooldownMinutes=30
provider.timeout=30000
provider.rateLimitMs=500

# ============================================================================
# HISTORICAL DATA SAFETY
# ============================================================================
scanner.allowHistoricalReload=true
scanner.historical.reload.confirm=true
scanner.historicalYears=5

historical.backfill.months=36
historical.backfill.enabled-on-universe-add=true

# ============================================================================
# DATA VALIDATION
# ============================================================================
validation.maxPriceSpike=0.40
validation.minPrice=0.01

# ============================================================================
# LOGGING
# ============================================================================
logging.level.root=INFO
logging.level.com.trading.scanner=INFO
logging.file.name=data/logs/scanner.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================================
# SCANNER AND APP INFO
# ============================================================================
app.name=@project.name@
app.version=@project.version@

# ============================================================================
# ANGEL ONE PROVIDER CONFIGURATION
# ============================================================================
provider.angelone.enabled=${ANGELONE_ENABLED:false}
provider.angelone.api-key=${ANGELONE_API_KEY:}
provider.angelone.client-id=${ANGELONE_CLIENT_ID:}
provider.angelone.password=${ANGELONE_PASSWORD:}
provider.angelone.totp-secret=${ANGELONE_TOTP_SECRET:}
provider.angelone.base-url=${ANGELONE_BASE_URL:https://apiconnect.angelone.in}
provider.angelone.client-local-ip=${ANGELONE_CLIENT_LOCAL_IP:127.0.0.1}
provider.angelone.client-public-ip=${ANGELONE_CLIENT_PUBLIC_IP:127.0.0.1}
provider.angelone.mac-address=${ANGELONE_MAC_ADDRESS:00:00:00:00:00:00}

spring.config.import=optional:file:.env[.properties]

# ============================================================================
# SWAGGER CONFIGURATION
# ============================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.defaultModelsExpandDepth=-1
springdoc.swagger-ui.defaultModelExpandDepth=0
springdoc.swagger-ui.defaultModelRendering=example
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha