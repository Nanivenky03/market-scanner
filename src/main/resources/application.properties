# ============================================================================
# MITHRON - APPLICATION CONFIGURATION
# ============================================================================

# Load environment overrides from local .env file if present
spring.config.import=optional:file:.env[.properties]

# ============================================================================
# 1. SERVER & APPLICATION INFORMATION
# ============================================================================
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.application.name=${SPRING_APPLICATION_NAME:Mithron}
app.name=${APP_NAME:Mithron}
app.version=${APP_VERSION:@project.version@}

# ============================================================================
# 2. DATABASE & FLYWAY MIGRATION
# ============================================================================
# PostgreSQL primary database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mithron_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway schema versioning
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql

# ============================================================================
# 3. EXCHANGE & MARKET TIMINGS
# ============================================================================
# Exchange market timezone and core trading hours
exchange.timezone=${EXCHANGE_TIMEZONE:Asia/Kolkata}
exchange.marketOpen=${EXCHANGE_MARKET_OPEN:09:15}
exchange.marketClose=${EXCHANGE_MARKET_CLOSE:15:30}

# ============================================================================
# 4. PROVIDER RESILIENCE & RATE LIMITING
# ============================================================================
# Buffer period (in hours) after market close before fetching historical daily data
provider.publishBufferHours=${PROVIDER_PUBLISH_BUFFER_HOURS:3}

# Provider retry and exponential backoff configuration
provider.retry.maxAttempts=${PROVIDER_RETRY_MAX_ATTEMPTS:3}
provider.retry.baseBackoffMs=${PROVIDER_RETRY_BASE_BACKOFF_MS:1000}
provider.retry.jitterMaxMs=${PROVIDER_RETRY_JITTER_MAX_MS:500}

# Circuit breaker policy for external HTTP API calls
provider.circuitBreaker.failureThreshold=${PROVIDER_CIRCUIT_FAILURE_THRESHOLD:5}
provider.circuitBreaker.cooldownMinutes=${PROVIDER_CIRCUIT_COOLDOWN_MINUTES:30}
provider.timeout=${PROVIDER_TIMEOUT_MS:30000}
provider.rateLimitMs=${PROVIDER_RATE_LIMIT_MS:500}

# ============================================================================
# 5. DATA VALIDATION POLICIES
# ============================================================================
# Maximum allowable price spike (40%) and minimum allowable price
validation.maxPriceSpike=${VALIDATION_MAX_PRICE_SPIKE:0.40}
validation.minPrice=${VALIDATION_MIN_PRICE:0.01}

# ============================================================================
# 6. ANGEL ONE BROKER INTEGRATION
# ============================================================================
# Authentication and API credentials
provider.angelone.enabled=${ANGELONE_ENABLED:false}
provider.angelone.api-key=${ANGELONE_API_KEY:}
provider.angelone.client-id=${ANGELONE_CLIENT_ID:}
provider.angelone.password=${ANGELONE_PASSWORD:}
provider.angelone.totp-secret=${ANGELONE_TOTP_SECRET:}
provider.angelone.base-url=${ANGELONE_BASE_URL:https://apiconnect.angelone.in}
provider.angelone.client-local-ip=${ANGELONE_CLIENT_LOCAL_IP:127.0.0.1}
provider.angelone.client-public-ip=${ANGELONE_CLIENT_PUBLIC_IP:127.0.0.1}
provider.angelone.mac-address=${ANGELONE_MAC_ADDRESS:00:00:00:00:00:00}

# SmartStream WebSocket configuration
provider.angelone.websocket-url=${ANGELONE_WEBSOCKET_URL:wss://smartapisocket.angelone.in/smart-stream}
provider.angelone.websocket-reconnect-seconds=${ANGELONE_WEBSOCKET_RECONNECT_SECONDS:5}
provider.angelone.websocket-max-subscriptions-per-connection=${ANGELONE_WEBSOCKET_MAX_SUBSCRIPTIONS_PER_CONNECTION:1000}

# Specific rate limits (delays in ms between calls)
provider.angelone.rate.auth.ms=${ANGELONE_RATE_AUTH_MS:1500}
provider.angelone.rate.search.ms=${ANGELONE_RATE_SEARCH_MS:500}
provider.angelone.rate.historical.ms=${ANGELONE_RATE_HISTORICAL_MS:500}

# Specific retry maximum attempts
provider.angelone.retry.auth.max-attempts=${ANGELONE_RETRY_AUTH_MAX_ATTEMPTS:2}
provider.angelone.retry.search.max-attempts=${ANGELONE_RETRY_SEARCH_MAX_ATTEMPTS:3}
provider.angelone.retry.historical.max-attempts=${ANGELONE_RETRY_HISTORICAL_MAX_ATTEMPTS:3}

# Specific throughput request limits (RPS / RPM)
provider.angelone.limit.auth.requests-per-second=${ANGELONE_LIMIT_AUTH_RPS:1}
provider.angelone.limit.auth.requests-per-minute=${ANGELONE_LIMIT_AUTH_RPM:30}
provider.angelone.limit.search.requests-per-second=${ANGELONE_LIMIT_SEARCH_RPS:2}
provider.angelone.limit.search.requests-per-minute=${ANGELONE_LIMIT_SEARCH_RPM:100}
provider.angelone.limit.historical.requests-per-second=${ANGELONE_LIMIT_HISTORICAL_RPS:2}
provider.angelone.limit.historical.requests-per-minute=${ANGELONE_LIMIT_HISTORICAL_RPM:120}

# Scrip Master download settings
provider.angelone.instrument-master-url=${ANGELONE_INSTRUMENT_MASTER_URL:https://margincalculator.angelbroking.com/OpenAPI_File/files/OpenAPIScripMaster.json}
provider.angelone.rate.instrument-master.ms=${ANGELONE_RATE_INSTRUMENT_MASTER_MS:1000}
provider.angelone.limit.instrument-master.requests-per-second=${ANGELONE_LIMIT_INSTRUMENT_MASTER_RPS:1}
provider.angelone.limit.instrument-master.requests-per-minute=${ANGELONE_LIMIT_INSTRUMENT_MASTER_RPM:30}
provider.angelone.retry.instrument-master.max-attempts=${ANGELONE_RETRY_INSTRUMENT_MASTER_MAX_ATTEMPTS:3}

# ============================================================================
# 7. AUTOMATED SCHEDULER & CRON JOBS
# ============================================================================
runtime.schedule.zone=${RUNTIME_SCHEDULE_ZONE:Asia/Kolkata}

# 07:00 AM - Morning Maintenance (Trading-day-init + Premarket-housekeeping)
runtime.schedule.morning-maintenance-cron=${RUNTIME_MORNING_MAINTENANCE_CRON:0 0 7 * * MON-FRI}

# 08:00 AM - Pre-Market Data Pipeline (Catalog sync + Universe sync + 15D Res/20D ADV/CPR/ADR/Baselines)
runtime.schedule.premarket-data-pipeline-cron=${RUNTIME_PREMARKET_DATA_PIPELINE_CRON:0 0 8 * * MON-FRI}

# 08:50 AM - Broker Login & Session Warmup
runtime.schedule.broker-warmup-cron=${RUNTIME_BROKER_WARMUP_CRON:0 50 8 * * MON-FRI}

# 08:55 AM - Pre-Market Live Start (Readiness gate check + Connect & Subscribe tokens)
runtime.schedule.live-runtime-start-cron=${RUNTIME_LIVE_RUNTIME_START_CRON:0 55 8 * * MON-FRI}

# 05:00 PM (Sundays) - Official NSE Holiday Calendar Auto-Refresh
runtime.schedule.calendar-refresh-cron=${RUNTIME_CALENDAR_REFRESH_CRON:0 0 17 * * SUN}

# Intraday Realtime & Rollover Jobs
runtime.schedule.market-state-update-cron=${RUNTIME_MARKET_STATE_UPDATE_CRON:0 * * * * *}
runtime.schedule.data-completeness-check-cron=${RUNTIME_DATA_COMPLETENESS_CHECK_CRON:0 */5 * * * *}
runtime.schedule.backfill-process-cron=${RUNTIME_BACKFILL_PROCESS_CRON:0 */5 * * * *}
runtime.schedule.live-gap-check-cron=${RUNTIME_LIVE_GAP_CHECK_CRON:0 * * * * *}
runtime.schedule.minute-rollover-cron=${RUNTIME_MINUTE_ROLLOVER_CRON:5 * 9-15 * * MON-FRI}
runtime.schedule.conditional-flush-cron=${RUNTIME_CONDITIONAL_FLUSH_CRON:0 */5 16-17 * * MON-FRI}

# 05:00 PM - Post-Market EOD Reconciliation & Official Candle Archiving
runtime.schedule.eod-reconciliation-cron=${RUNTIME_EOD_RECONCILIATION_CRON:0 0 17 * * MON-FRI}

# 05:15 PM - Post-EOD Teardown & Broker Session Clear
runtime.schedule.broker-session-clear-cron=${RUNTIME_BROKER_SESSION_CLEAR_CRON:0 15 17 * * MON-FRI}

# ============================================================================
# 8. RUNTIME BOOTSTRAP & SEEDING
# ============================================================================
runtime.bootstrap.auto-seed-universe=${RUNTIME_BOOTSTRAP_AUTO_SEED_UNIVERSE:true}
runtime.bootstrap.auto-build-instrument-master=${RUNTIME_BOOTSTRAP_AUTO_BUILD_INSTRUMENT_MASTER:true}
runtime.bootstrap.auto-sync-missing-tokens=${RUNTIME_BOOTSTRAP_AUTO_SYNC_MISSING_TOKENS:true}

# ============================================================================
# 9. NSE TRADING CALENDAR CONFIGURATION
# ============================================================================
runtime.calendar.official-nse-trading-api-url-template=${RUNTIME_CALENDAR_OFFICIAL_NSE_TRADING_API_URL_TEMPLATE:https://www.nseindia.com/api/holiday-master?type=trading&year=%d}
runtime.calendar.official-nse-trading-segment=${RUNTIME_CALENDAR_OFFICIAL_NSE_TRADING_SEGMENT:CM}
runtime.calendar.refresh-timeout-ms=${RUNTIME_CALENDAR_REFRESH_TIMEOUT_MS:10000}
runtime.calendar.auto-refresh=${RUNTIME_CALENDAR_AUTO_REFRESH:true}
runtime.calendar.refresh-day=${RUNTIME_CALENDAR_REFRESH_DAY:SUNDAY}
runtime.calendar.refresh-check-time=${RUNTIME_CALENDAR_REFRESH_CHECK_TIME:17:00}

# ============================================================================
# 10. LIVE FEED & FEED HEALTH MONITORING
# ============================================================================
runtime.live.auto-run=${RUNTIME_LIVE_AUTO_RUN:false}
runtime.live.subscription-mode=${RUNTIME_LIVE_SUBSCRIPTION_MODE:3}
runtime.live.auto-recover=${RUNTIME_LIVE_AUTO_RECOVER:true}
runtime.live.recovery-interval-ms=${RUNTIME_LIVE_RECOVERY_INTERVAL_MS:60000}
runtime.live.reconnect-backoff-seconds=${RUNTIME_LIVE_RECONNECT_BACKOFF_SECONDS:30}

runtime.feed-health.check-interval-ms=${RUNTIME_FEED_HEALTH_CHECK_INTERVAL_MS:15000}
runtime.feed-health.stale-after-seconds=${RUNTIME_FEED_HEALTH_STALE_AFTER_SECONDS:90}
runtime.feed-health.recovery-ticks=${RUNTIME_FEED_HEALTH_RECOVERY_TICKS:2}

# ============================================================================
# 11. RUNTIME OPERATIONAL DEFAULTS & RETENTION
# ============================================================================
runtime.housekeeping.auto-run=${RUNTIME_HOUSEKEEPING_AUTO_RUN:true}

runtime.defaults.angelone-login-time=${RUNTIME_DEFAULT_ANGELONE_LOGIN_TIME:08:50}
runtime.defaults.websocket-connect-time=${RUNTIME_DEFAULT_WEBSOCKET_CONNECT_TIME:09:15}
runtime.defaults.websocket-disconnect-time=${RUNTIME_DEFAULT_WEBSOCKET_DISCONNECT_TIME:15:40}
runtime.defaults.angelone-disconnect-time=${RUNTIME_DEFAULT_ANGELONE_DISCONNECT_TIME:17:00}
runtime.defaults.housekeeping-time=${RUNTIME_DEFAULT_HOUSEKEEPING_TIME:05:30}
runtime.defaults.market-open-time=${RUNTIME_DEFAULT_MARKET_OPEN_TIME:09:15}
runtime.defaults.market-close-time=${RUNTIME_DEFAULT_MARKET_CLOSE_TIME:15:30}
runtime.defaults.websocket-idle-close-minutes=${RUNTIME_DEFAULT_WEBSOCKET_IDLE_CLOSE_MINUTES:10}
runtime.defaults.websocket-close-recheck-minutes=${RUNTIME_DEFAULT_WEBSOCKET_CLOSE_RECHECK_MINUTES:10}
runtime.defaults.retention-candles-days=${RUNTIME_DEFAULT_RETENTION_CANDLES_DAYS:30}
runtime.defaults.retention-live-signals-days=${RUNTIME_DEFAULT_RETENTION_LIVE_SIGNALS_DAYS:30}

# Admin endpoint security secret
runtime.admin.reset-secret=${RUNTIME_ADMIN_RESET_SECRET:}

# ============================================================================
# 12. EOD RECONCILIATION & HISTORICAL RAW DATA ARCHIVING
# ============================================================================
# Root path for raw EOD JSON archive files (organized by date folders and symbol files)
runtime.eod.raw-archive-dir=${EOD_RAW_ARCHIVE_DIR:./data/raw-eod}

# Price matching tolerance during live vs historical reconciliation
runtime.reconciliation.price-tolerance=${RUNTIME_RECONCILIATION_PRICE_TOLERANCE:0.0001}

# ============================================================================
# 13. SYSTEM ALERTS & NOTIFICATIONS
# ============================================================================
runtime.alert.auto-run=${RUNTIME_ALERT_AUTO_RUN:true}
runtime.alert.stale-ticks-minutes=${RUNTIME_ALERT_STALE_TICKS_MINUTES:10}
runtime.alert.parser-failures-threshold=${RUNTIME_ALERT_PARSER_FAILURES_THRESHOLD:10}
runtime.alert.evaluation-interval-ms=${RUNTIME_ALERT_EVALUATION_INTERVAL_MS:60000}
runtime.alert.scheduled-job-severity=${RUNTIME_ALERT_SCHEDULED_JOB_SEVERITY:MEDIUM}

# Webhook Alert Dispatcher
runtime.alert.webhook-enabled=${RUNTIME_ALERT_WEBHOOK_ENABLED:false}
runtime.alert.webhook-url=${RUNTIME_ALERT_WEBHOOK_URL:}
runtime.alert.webhook-timeout-ms=${RUNTIME_ALERT_WEBHOOK_TIMEOUT_MS:5000}
runtime.alert.webhook-min-severity=${RUNTIME_ALERT_WEBHOOK_MIN_SEVERITY:MEDIUM}

# Email Alert Dispatcher
runtime.alert.email-enabled=${RUNTIME_ALERT_EMAIL_ENABLED:false}
runtime.alert.email-to=${RUNTIME_ALERT_EMAIL_TO:}
runtime.alert.email-from=${RUNTIME_ALERT_EMAIL_FROM:}
runtime.alert.email-min-severity=${RUNTIME_ALERT_EMAIL_MIN_SEVERITY:MEDIUM}
runtime.alert.email-subject-prefix=${RUNTIME_ALERT_EMAIL_SUBJECT_PREFIX:[Mithron]}

# ============================================================================
# 14. SPRING MAIL CONFIGURATION
# ============================================================================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

# ============================================================================
# 15. LOGGING CONFIGURATION
# ============================================================================
logging.level.root=INFO
logging.level.com.trading.scanner=INFO
logging.file.name=${LOGGING_FILE_NAME:mithron.log}
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================================
# 16. OPENAPI / SWAGGER UI DOCUMENTATION
# ============================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.defaultModelsExpandDepth=-1
springdoc.swagger-ui.defaultModelExpandDepth=0
springdoc.swagger-ui.defaultModelRendering=example
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
